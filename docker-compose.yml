# Vorlage für Test- und Produktivserver.
# Image und Umgebung trägt die Pipeline ein; HOST_PORT und die übrigen Variablen kommen aus dem Portainer-Stack.
# Die Datenbank ist nur für die App erreichbar (kein Port nach außen).
services:
  app:
    image: ghcr.io/matthiasknauff/bauportal-neu:v0.1.20
    container_name: bauportal-neu-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT}:8000"
    environment:
      APP_ENV: prod
      TZ: Europe/Berlin
      DATABASE_URL: postgres://bauportal:${DB_PASSWORT:-bauportal}@db:5432/bauportal
      DB_VERBINDUNGEN: ${DB_VERBINDUNGEN:-20}
      DATEIDIENST_URL: http://dateidienst:8000
      IFCDIENST_URL: http://ifcdienst:8000
      DRUCKDIENST_URL: http://druckdienst:8000
      KIDIENST_URL: http://kidienst:8000
      DIENST_SCHLUESSEL: ${DB_PASSWORT:-bauportal}
    volumes:
      - daten:/data

  # Dateidienst: spricht mit dem Dateiserver. Nur für die App erreichbar (kein Port nach außen), merkt sich nichts.
  dateidienst:
    image: ghcr.io/matthiasknauff/bauportal-neu-dateidienst:v0.1.20
    container_name: bauportal-neu-prod-dateidienst
    restart: unless-stopped
    environment:
      DIENST_SCHLUESSEL: ${DB_PASSWORT:-bauportal}
      TZ: Europe/Berlin

  db:
    image: postgres:18-alpine
    container_name: bauportal-neu-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bauportal
      POSTGRES_PASSWORD: ${DB_PASSWORT:-bauportal}
      POSTGRES_DB: bauportal
      TZ: Europe/Berlin
    volumes:
      - datenbank:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bauportal -d bauportal"]
      interval: 5s
      timeout: 5s
      retries: 20

  # IFC-Dienst: liest IFC-Dateien für das Gebäudemodell. Nur für die App erreichbar, merkt sich nichts.
  ifcdienst:
    image: ghcr.io/matthiasknauff/bauportal-neu-ifcdienst:v0.1.20
    container_name: bauportal-neu-prod-ifcdienst
    restart: unless-stopped
    environment:
      DIENST_SCHLUESSEL: ${DB_PASSWORT:-bauportal}
      TZ: Europe/Berlin

  # Druckdienst: macht aus der fertigen Seite das PDF (Chromium ohne Fenster). Nur für die App erreichbar, merkt sich nichts.
  druckdienst:
    image: ghcr.io/matthiasknauff/bauportal-neu-druckdienst:v0.1.20
    container_name: bauportal-neu-prod-druckdienst
    restart: unless-stopped
    environment:
      DIENST_SCHLUESSEL: ${DB_PASSWORT:-bauportal}
      TZ: Europe/Berlin

  # KI-Ausgang: die eine Stelle, die mit einer KI spricht (Ollama im Büro oder Anbieter außerhalb). Nur für die App
  # erreichbar, merkt sich nichts. Ohne eingerichtete KI-Anbindung (Verwaltung → KI) geht hier nichts hinaus.
  kidienst:
    image: ghcr.io/matthiasknauff/bauportal-neu-kidienst:v0.1.20
    container_name: bauportal-neu-prod-kidienst
    restart: unless-stopped
    environment:
      DIENST_SCHLUESSEL: ${DB_PASSWORT:-bauportal}
      TZ: Europe/Berlin

volumes:
  daten:
    name: ${VOLUME_NAME}
  datenbank:
    name: ${VOLUME_NAME}-db
