# Vorlage für Test- und Produktivserver.
# Image und Umgebung trägt die Pipeline ein; HOST_PORT und die übrigen Variablen kommen aus dem Portainer-Stack.
services:
  app:
    image: ghcr.io/matthiasknauff/bauportal-neu:test-ec71ef2
    container_name: bauportal-neu-test
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:8000"
    environment:
      APP_ENV: test
      TZ: Europe/Berlin
    volumes:
      - daten:/data

volumes:
  daten:
    name: ${VOLUME_NAME}
