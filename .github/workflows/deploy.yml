name: Build und Bereitstellung

# push auf main      -> Image bauen, Testserver bekommt es automatisch (Zweig deploy-test)
# Release freigeben  -> Image mit Versionsnummer bauen, Produktivserver bekommt es (Zweig deploy-prod)
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || 'test' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Typprüfung und Tests (ohne grüne Tests kein Image)
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: |
          npm ci --no-audit --no-fund
          npm run typen
          npm test

      - name: Ziel und Version bestimmen
        id: meta
        run: bash .github/scripts/meta.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.kanal }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Weitere Images (deploy/images.txt)
        if: hashFiles('deploy/images.txt') != ''
        run: |
          # je Zeile: <name> <ordner>  →  Image <haupt-image>-<name> aus dem Dockerfile im Ordner
          grep -vE '^[[:space:]]*(#|$)' deploy/images.txt | while read -r NAME ORDNER; do
            ZIEL="${{ env.IMAGE }}-${NAME}"
            echo "::group::${ZIEL}"
            docker buildx build --push \
              -t "${ZIEL}:${{ steps.meta.outputs.tag }}" -t "${ZIEL}:${{ steps.meta.outputs.kanal }}" \
              --build-arg APP_VERSION=${{ steps.meta.outputs.version }} \
              --cache-from "type=registry,ref=${ZIEL}:buildcache" \
              --cache-to "type=registry,ref=${ZIEL}:buildcache,mode=max" \
              "${ORDNER:-$NAME}"
            echo "::endgroup::"
          done

      - name: Server-Zweig aktualisieren (Portainer holt sich das automatisch)
        run: bash .github/scripts/deploy-branch.sh "${{ steps.meta.outputs.ziel }}" "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      - name: Zusammenfassung
        run: |
          echo "### ${{ steps.meta.outputs.ziel == 'prod' && 'Produktiv' || 'Test' }}: ${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
